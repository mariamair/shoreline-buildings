name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      db: ${{ steps.filter.outputs.db }}
      seed: ${{ steps.filter.outputs.seed }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
            db:
              - 'db/**'
              - 'docker-compose.yml'
            seed:
              - 'seed/**'
              - 'docker-compose.yml'

  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [detect-changes]
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=db
          DB_PORT=5432
          BACKEND_PORT=8080
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          CSV_PATH=seed/data/shoreline_buildings.csv
          EOF

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push backend
        if: needs.detect-changes.outputs.backend == 'true' || github.event.before == '0000000000000000000000000000000000000000'
        run: |
          docker compose build backend
          docker compose push backend

      - name: Build and push db
        if: needs.detect-changes.outputs.db == 'true' || github.event.before == '0000000000000000000000000000000000000000'
        run: |
          docker compose build db
          docker compose push db

      - name: Build and push seed
        if: needs.detect-changes.outputs.seed == 'true' || github.event.before == '0000000000000000000000000000000000000000'
        run: |
          docker compose build seed
          docker compose push seed

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Deploy reminder
        run: echo "Build and tests passed. Please run ./deploy.sh to deploy to production."