name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all services'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      authserver: ${{ steps.filter.outputs.authserver }}
      backend: ${{ steps.filter.outputs.backend }}
      seed: ${{ steps.filter.outputs.seed }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            authserver:
              - 'auth/**'
              - 'docker-compose.yml'
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
            seed:
              - 'seed/**'
              - 'docker-compose.yml'

  lint-backend:
    name: Checkstyle
    runs-on: ubuntu-latest
    needs: [detect-changes]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        if: needs.detect-changes.outputs.backend == 'true' || github.event.before == '0000000000000000000000000000000000000000'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run Checkstyle
        working-directory: backend
        if: needs.detect-changes.outputs.backend == 'true' || github.event.before == '0000000000000000000000000000000000000000'
        run: mvn checkstyle:check 

  lint-auth-server:
    name: ESLint
    runs-on: ubuntu-latest
    needs: [detect-changes]
    steps:
      - name: Checkout code
        if: needs.detect-changes.outputs.authserver == 'true' || github.event.before == '0000000000000000000000000000000000000000'
        uses: actions/checkout@v5

      - name: Set up Node.js
        if: needs.detect-changes.outputs.authserver == 'true' || github.event.before == '0000000000000000000000000000000000000000'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'auth/package-lock.json'

      - name: Install dependencies
        if: needs.detect-changes.outputs.authserver == 'true' || github.event.before == '0000000000000000000000000000000000000000'
        run: npm ci --prefix auth

      - name: Run ESLint
        if: needs.detect-changes.outputs.authserver == 'true' || github.event.before == '0000000000000000000000000000000000000000'
        run: npm run lint --prefix auth

  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-backend, lint-auth-server]
    permissions:
      packages: write
      contents: read
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.development.yml
    steps:
      - uses: actions/checkout@v5

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          DB_NAME=${{ secrets.DB_NAME }}
          DB_ADMIN=${{ secrets.DB_ADMIN }}
          DB_ADMIN_PASSWORD=${{ secrets.DB_ADMIN_PASSWORD }}
          DB_USER=${{ secrets.DB_USER }}
          DB_USER_PASSWORD=${{ secrets.DB_USER_PASSWORD }}
          DB_HOST=db
          DB_PORT=5432
          AUTH_DB_URI=${{ secrets.AUTH_DB_URI }}
          AUTH_DB_PORT=27017
          AUTH_SERVER_PORT=3000
          AUTH_LOG_LEVEL=info
          ACCESS_TOKEN_LIFE=1h
          REFRESH_TOKEN_LIFE=1d
          ACCESS_TOKEN_PRIVATE_KEY=${{ secrets.ACCESS_TOKEN_PRIVATE_KEY }}
          ACCESS_TOKEN_PUBLIC_KEY=${{ secrets.ACCESS_TOKEN_PUBLIC_KEY }}
          REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}
          BACKEND_PORT=8080
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          CSV_PATH=seed/data/shoreline_buildings.csv
          EOF

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push auth-server
        if: needs.detect-changes.outputs.authserver == 'true' || github.event.before == '0000000000000000000000000000000000000000' || github.event.inputs.force_rebuild == 'true'
        run: |
          docker compose build --no-cache auth-server
          docker compose push auth-server

      - name: Build and push backend
        if: needs.detect-changes.outputs.backend == 'true' || github.event.before == '0000000000000000000000000000000000000000' || github.event.inputs.force_rebuild == 'true'
        run: |
          docker compose build --no-cache backend
          docker compose push backend

      - name: Build and push db
        run: |
          docker compose build --no-cache db
          docker compose push db

      - name: Build and push seed
        if: needs.detect-changes.outputs.seed == 'true' || github.event.before == '0000000000000000000000000000000000000000' || github.event.inputs.force_rebuild == 'true'
        run: |
          docker compose build --no-cache seed
          docker compose push seed

  test:
    name: Run API Tests
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          DB_NAME=${{ secrets.DB_NAME }}
          DB_ADMIN=${{ secrets.DB_ADMIN }}
          DB_ADMIN_PASSWORD=${{ secrets.DB_ADMIN_PASSWORD }}
          DB_USER=${{ secrets.DB_USER }}
          DB_USER_PASSWORD=${{ secrets.DB_USER_PASSWORD }}
          DB_HOST=db
          DB_PORT=5432
          AUTH_DB_URI=${{ secrets.AUTH_DB_URI }}
          AUTH_DB_PORT=27017
          AUTH_SERVER_PORT=3000
          AUTH_LOG_LEVEL=info
          ACCESS_TOKEN_LIFE=1h
          REFRESH_TOKEN_LIFE=1d
          ACCESS_TOKEN_PRIVATE_KEY=${{ secrets.ACCESS_TOKEN_PRIVATE_KEY }}
          ACCESS_TOKEN_PUBLIC_KEY=${{ secrets.ACCESS_TOKEN_PUBLIC_KEY }}
          REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}
          BACKEND_PORT=8080
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          CSV_PATH=seed/data/shoreline_buildings.csv
          EOF

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Start services
        run: docker compose pull && docker compose up -d --wait

      - name: Wait for auth server to be ready
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/auth && break
            echo "Waiting for auth server... ($i/30)"
            sleep 2
          done

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8080/api/health && break
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman tests
        run: |
          newman run tests/api-tests/ShorelineBuildingsAPI.postman_collection.json \
            --environment tests/api-tests/ci.postman_environment.json \
            --reporters cli

      - name: Tear down services
        if: always()
        run: docker compose down

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test]
    environment: production
    steps:
      - name: Deploy reminder
        run: echo "Approved! Please run ./deploy.sh to deploy to production."